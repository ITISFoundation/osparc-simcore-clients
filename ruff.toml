# Ruff configuration for the whole repository.
#
# `ruff format` is the single Python formatter (it also formats the OpenAPI
# client artifacts, SEE clients/python/Makefile) and `ruff check` is the linter
# wired through .pre-commit-config.yaml.
line-length = 88

# Keep this at the lowest supported interpreter, SEE clients/python/setup.py
# (`python_requires`). Pinning it to the floor is what prevents the linter from
# suggesting or auto-fixing to syntax the oldest supported Python cannot parse
# (PEP 604 unions need 3.10, `match` needs 3.10, `asyncio.timeout` needs 3.11).
target-version = "py39"

[lint]
select = [
    "E4", # pycodestyle imports
    "E7", # pycodestyle statements
    "E9", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
    "B", # bugbear: bug-prone patterns
    "C4", # comprehensions
    "SIM", # redundant code shapes
    "UP", # modern Python, bounded by target-version above
]
ignore = [
    # The client is generated by openapi-python-client, which emits `typing.Dict`
    # /`typing.List` style annotations, and the hand-written code around it follows
    # that style. Rewriting them to builtin generics here would keep fighting the
    # generator output. Revisit when the generator emits builtin generics.
    "UP006",
    "UP035",
]

[lint.per-file-ignores]
# Public API shims: the star-import / `import x as x` re-export shape is intended.
"clients/python/src/osparc/__init__.py" = ["F401", "F403"]
"clients/python/src/osparc/models.py" = ["F401"]
"clients/python/src/osparc/exceptions.py" = ["F401"]
# A notebook cell is executed on its own, so imports may well follow the cell
# holding the parameters.
"**/*.ipynb" = ["E402"]
