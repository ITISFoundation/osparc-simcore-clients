# Configuration of the end-to-end suite in this directory.
#
# The suite talks to a real deployment and reads OSPARC_API_HOST, OSPARC_API_KEY and
# OSPARC_API_SECRET from the environment, so the caller must export them first. From
# clients/python:
#   pytest test/e2e --junitxml=<dir>/junit_<client>_<host>.xml
[pytest]
# SEE https://pytest-asyncio.readthedocs.io/en/stable/concepts.html#test-discovery-modes
asyncio_mode = auto
# Without the plugin the coroutine tests are not collected and would silently disappear from
# the run, so this names it to make pytest fail on a missing install instead.
required_plugins = pytest-asyncio
# tee-sys streams captured output while a test runs. Most tests here wait on a job on the
# server, which takes minutes, and without it a CI job shows nothing at all until they end.
addopts = -v --capture=tee-sys --durations=10 --color=yes
