[tool.poetry]
name = "e2e"
version = "0.1.0"
description = ""
authors = ["Mads Bisgaard <bisgaard@itis.swiss>"]
readme = "README.md"

[tool.poetry.dependencies]
osparc = "*"
packaging = ">=23.2,<24.0"
pandas = {extras = ["plot", "output-formatting"], version = ">=2.1,<3.0"}
pydantic = ">=2.5,<3.0"
pydantic-settings = ">=2.1,<3.0"
pytest = ">=7.4,<8.0"
python = ">=3.11,<4.0"
# 0.12 is the first typer that resolves PEP 604 (`X | None`) annotations in
# command signatures; older ones raise `Type not yet supported`. `rich` became
# a plain dependency in 0.12, so the `all` extra is no longer needed.
typer = ">=0.12,<1.0"
tenacity = ">=8.2.3,<9.0"

[tool.poetry.scripts]
e2e = "e2e.cli:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.package]
include = ["data/*.csv"]
