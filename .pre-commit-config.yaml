# See https://pre-commit.com/hooks.html for more hooks
#
# Every hook is pinned to a commit SHA, with its tag in a trailing `frozen:` comment.
# Update with `pre-commit autoupdate --freeze`, which moves the SHA and rewrites that
# comment. Plain `pre-commit autoupdate` replaces the SHA with a tag instead.
exclude: "^.venv$|^.cache$|^.pytest_cache$"
# No `default_language_version` on purpose: pinning it makes every hook environment
# require that literal interpreter on PATH, which `make devenv` does not guarantee.
# The pinned revisions above already pin the tools they install.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
  - repo: https://github.com/roy-ht/pre-commit-jupyter
    rev: 551ab39ffcb92404c78593515520b05ec1dab9e3  # frozen: v1.2.1
    hooks:
      - id: jupyter-notebook-cleanup
        language: python
        entry: jupyter-notebook-cleanup
        args:
          - --remove-kernel-metadata
          - --pin-patterns
          - "[pin];[donotremove]"
        # Scoped to the e2e notebooks. The tutorials under clients/python/docs are
        # committed with their outputs because they are the rendered documentation.
        files: ^clients/python/test/e2e/.*[.]ipynb$
        types: ["file"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c  # frozen: v0.17.3
    hooks:
      # Rule selection and formatting settings live in `ruff.toml` at the repo root.
      - id: ruff
        args:
          - --fix
          - --exit-non-zero-on-fix
      - id: ruff-format
  - repo: local
    hooks:
      # Guards the interpreter floor that clients/python/setup.py declares: a
      # newer-only construct only fails at runtime on the oldest interpreter, and mypy
      # cannot target 3.9 here (SEE clients/python/pyproject.toml).
      - id: vermin-python-floor
        name: vermin (clients/python must run on Python 3.9)
        language: python
        additional_dependencies: ["vermin==1.9.2"]
        entry: vermin
        args:
          - --target=3.9-
          - --no-tips
          - clients/python/src/osparc
        files: ^clients/python/src/osparc/.*\.py$
        pass_filenames: false

      # The floor is also written down in ruff.toml, in the hook above, in the CI matrix
      # and in the classifiers, and nothing keeps those in sync but this script.
      - id: python-floor-agrees
        name: the declared Python floor agrees everywhere it is written down
        language: system
        entry: scripts/check-python-floor.bash
        files: ^(clients/python/setup\.py|ruff\.toml|\.pre-commit-config\.yaml|\.github/workflows/build-python-client\.yml)$
        pass_filenames: false
