name: lint
on:
  workflow_dispatch:
  push:
  pull_request:
# Nothing here writes to the repository: the hooks read the checkout and install tools from
# PyPI. Without this block the token inherits the repository's default permissions.
permissions:
  contents: read
jobs:
  # Runs the hooks in .pre-commit-config.yaml, which are opt-in on a developer machine.
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # the interpreter `make devenv` creates, from `.python-version`
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install the dev tools
        run: make devenv
      - run: .venv/bin/pre-commit run --all-files --show-diff-on-failure
  # Not in the pre-commit hooks: mypy needs the interpreter and dependency set pinned in
  # scripts/mypy/, not the dev environment.
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # the interpreter `make devenv` creates, from `.python-version`
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        # caching is on by default here, keyed on **/*requirements*.txt, which covers
        # scripts/mypy/requirements.txt
      - name: Type check the client
        run: make -C clients/python mypy
  # The interpreter end-of-life dates in the client are a copy of a third-party API. This
  # check needs network access, so it runs here and not as a pre-commit hook, which must
  # work offline.
  python-eol-dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the interpreter end-of-life dates
        run: scripts/check-python-eol-dates.bash
